        <p>均匀牌废物介绍：</p>
        <h1>均匀显卡</h1>
        <p>这是一张超废物的显卡，仅1个CUDA，没有任何显存，不支持除了OpenGL1.0之外任何的协议，打游戏就别想了，连LOL都不行，连CS1.6都不行，连我的世界都不行，连GTA5都不行。</p>
        <h1>均匀CPU</h1>
        <p>这是一颗超废物的CPU，仅有1个核心，0.5个线程(每计算一个任务都要休息一个指令周期)，主频仅有0.1MHz，连Windows XP都不支持，连Windows 98都不支持，连Windows 95都不支持，连DOS都不支持。</p>
